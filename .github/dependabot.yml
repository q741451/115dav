version: 2

# Everything in this repository is pinned on purpose. Pinning without a way to
# move forward just means shipping old, unpatched code, so Dependabot proposes
# the bumps as reviewable pull requests and a human decides when to take them.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Keeps the digest in the workflow's BUILDER variable moving when a new Go
  # patch release lands. Requires the image reference to stay in the
  # "name:tag@sha256:..." form.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
