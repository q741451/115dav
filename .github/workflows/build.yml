name: build

# push        -> test and cross-compile, artifacts attached to the run
# push a v tag -> the same, then publish a GitHub Release
# Run workflow -> the same, and publish only if you tick the box
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release
        type: boolean
        default: false
      tag:
        description: Tag to release as, e.g. v0.1.0 (required when publishing)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never discard a tag build half way; superseded branch builds are fine to drop.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # ─────────────────────────────────────────────────────────────────────────
  # The build environment, in one line.
  #
  # This is golang:1.27.1-bookworm pinned by digest. A tag can be repointed at
  # new content by whoever publishes it; a digest is the content. Because the
  # compiler only ever runs inside this image, the runner's own OS -- which
  # GitHub rebuilds continuously and eventually retires -- contributes nothing
  # to the binaries, and the `verify` job below proves that rather than
  # assuming it.
  #
  # To move to a newer Go: change this line, and nothing else.
  # To find the digest:
  #   docker buildx imagetools inspect golang:1.28.0-bookworm | head -2
  # ─────────────────────────────────────────────────────────────────────────
  BUILDER: golang:1.27.1-bookworm@sha256:648f440f42a0958804efb24df176f806f9d353b41f1c0627f666428e40310f6b

jobs:
  build:
    # ubuntu-latest, always. It is the one Ubuntu label GitHub never deletes:
    # 18.04 and 20.04 are already gone and 24.04 will follow, so pinning a
    # numbered label trades a workflow that breaks on a schedule for
    # determinism it does not actually provide. Determinism comes from the
    # container below, whose digest does not expire.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      binsums: ${{ steps.sums.outputs.binsums }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide the version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            version="${INPUT_TAG}"
          else
            if [ "${INPUT_PUBLISH}" = true ]; then
              echo "::error::publishing from the web UI needs a tag, e.g. v0.1.0"
              exit 1
            fi
            version="0.0.0-$(git rev-parse --short=12 HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building ${version}"

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(scripts/in-builder.sh gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean:"$'\n'"$unformatted"
            exit 1
          fi

      - name: Verify the module graph
        run: scripts/in-builder.sh go mod verify

      - name: Vet
        run: scripts/in-builder.sh go vet ./...

      - name: Test
        # The race detector is the one thing here that needs cgo, so it is the
        # one place CGO_ENABLED is not zero. Release binaries never are.
        run: CGO_ENABLED=1 scripts/in-builder.sh go test -race -count=1 ./...

      - name: Cross-compile every target
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/in-builder.sh scripts/build-all.sh

      - name: Record the binary checksums
        id: sums
        run: |
          set -euo pipefail
          {
            echo 'binsums<<CHECKSUMS'
            cat dist/SHA256SUMS.bin
            echo 'CHECKSUMS'
          } >> "$GITHUB_OUTPUT"
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  verify:
    # The pinned image is what makes the build deterministic; this job checks
    # that it really is, by building the same commit a second time on a fresh
    # machine and demanding byte-identical binaries.
    #
    # It runs on ubuntu-latest like everything else. An earlier version pinned
    # this job to an older numbered label so the two builds would differ in
    # host, but that put a deletable label on the critical path to buy a
    # comparison the container already guarantees. If the host ever does start
    # leaking into the output, the far more likely symptom is this job failing
    # after GitHub moves ubuntu-latest to a new release -- which is exactly
    # when it should fail.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build again on a fresh machine
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: scripts/in-builder.sh scripts/build-all.sh

      - name: Compare against the first build
        env:
          # Through the environment, not string interpolation, so the contents
          # can never be read as shell.
          EXPECTED: ${{ needs.build.outputs.binsums }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EXPECTED" > /tmp/expected.sums
          if diff -u /tmp/expected.sums dist/SHA256SUMS.bin; then
            echo "reproduced exactly on a second machine"
          else
            echo "::error::the two builds differ; something outside the pinned image is leaking in"
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Creates the tag too, when the run was started from the web UI.
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
