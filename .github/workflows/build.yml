name: build

# push        -> test and cross-compile, artifacts attached to the run
# push a v tag -> the same, then publish a GitHub Release
# Run workflow -> the same, and publish only if you tick the box
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release
        type: boolean
        default: false
      tag:
        description: Tag to release as, e.g. v0.1.0 (required when publishing)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # Never discard a tag build half way; superseded branch builds are fine to drop.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    # ubuntu-latest, always. It is the one Ubuntu label GitHub never deletes:
    # 18.04 and 20.04 are already gone and 24.04 will follow, so pinning a
    # numbered label buys a workflow that breaks on a schedule, in exchange
    # for determinism it cannot provide anyway. The environment that decides
    # what the binaries look like is .github/builder/Dockerfile -- Ubuntu
    # 22.04 by digest, plus a checksum-verified Go -- and every step below
    # runs inside it.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      binsums: ${{ steps.sums.outputs.binsums }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide the version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            version="${INPUT_TAG}"
          else
            if [ "${INPUT_PUBLISH}" = true ]; then
              echo "::error::publishing from the web UI needs a tag, e.g. v0.1.0"
              exit 1
            fi
            version="0.0.0-$(git rev-parse --short=12 HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building ${version}"

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(scripts/in-builder.sh gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean:"$'\n'"$unformatted"
            exit 1
          fi

      - name: Verify the module graph
        run: scripts/in-builder.sh go mod verify

      - name: Vet
        run: scripts/in-builder.sh go vet ./...

      - name: Test
        # The race detector is the one thing here that needs cgo, so it is the
        # one place CGO_ENABLED is not zero. Release binaries never are.
        run: CGO_ENABLED=1 scripts/in-builder.sh go test -race -count=1 ./...

      - name: Cross-compile every target
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/in-builder.sh scripts/build-all.sh

      - name: Record the binary checksums
        id: sums
        run: |
          set -euo pipefail
          {
            echo 'binsums<<CHECKSUMS'
            cat dist/SHA256SUMS.bin
            echo 'CHECKSUMS'
          } >> "$GITHUB_OUTPUT"
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  verify:
    # The pinned image is what makes the build deterministic; this job checks
    # that it really is, by rebuilding the same commit on a second fresh
    # machine and demanding byte-identical binaries. Anything that leaks in
    # from outside the image -- a timestamp, a path, the runner's own state --
    # shows up here rather than in a release.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build again on a fresh machine
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: scripts/in-builder.sh scripts/build-all.sh

      - name: Compare against the first build
        env:
          # Through the environment, not string interpolation, so the contents
          # can never be read as shell.
          EXPECTED: ${{ needs.build.outputs.binsums }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EXPECTED" > /tmp/expected.sums
          if diff -u /tmp/expected.sums dist/SHA256SUMS.bin; then
            echo "reproduced exactly on a second machine"
          else
            echo "::error::the two builds differ; something outside the pinned image is leaking in"
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Creates the tag too, when the run was started from the web UI.
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
